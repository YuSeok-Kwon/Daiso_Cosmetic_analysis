pipeline:
  auto_schedule:
    enabled: true           # 월간 자동 실행
    cron: "0 3 1 * *"      # 매월 1일 03시

  crawling:
    mode: "incremental"     # "incremental" | "full"
    strategy: "hybrid"      # "scroll" | "bq_sync" | "hybrid"
    # scroll: 기존 카테고리 스크롤 방식 (기본)
    # bq_sync: BQ 전체 제품 리뷰 동기화만
    # hybrid: 카테고리 스크롤(신규 발견) + BQ 동기화(기존 리뷰 업데이트)
    headless: true          # 헤드리스 모드
    crawl_reviews: true
    crawl_ingredients: true
    history_file: "05_src/01_crawling/cache/crawl_history.json"

    # 카테고리 선택
    #   - all → 해당 중분류의 소분류 전체
    #   - 개별 소분류명 → 해당 소분류만
    #   - 키 자체가 없으면 → 해당 중분류 비활성화
    #   - active_categories 자체가 없으면 → 전체 카테고리
    active_categories:
      스킨케어:
        - all
      메이크업:
        - all
      네일용품:
        - all
      맨케어:
        - all
      미용소품:
        - all
      헤어/바디:
        - all

  storage:
    local:
      csv: false             # 로컬 CSV 비활성화 (BQ 전환)
      parquet: false          # 로컬 Parquet 비활성화
      base_dir: "02_processed_data"
    bigquery:
      enabled: true           # BigQuery 활성화
      dataset: "daiso"

  absa:
    enabled: true
    bundle_path: "06_analysis/03_ABSA/07_models/prod_bundle_stage3a_v1_20260225"
    version: "stage3a_v2"

  sli:
    enabled: true
    version: "v1"
    min_votes: 3              # 최소 투표 수

  search_trend:
    enabled: false            # 자동화 제외 (수동 실행만)
    period_start: "2024-01-01"
    period_end: "auto"        # 현재 월 자동 계산

  dashboard:
    enabled: true
    output_path: "02_outputs/dashboard/"
